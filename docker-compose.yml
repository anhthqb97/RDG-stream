name: rdg-stream

services:
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    container_name: rdg-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - stream
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  cassandra:
    image: cassandra:4.1
    hostname: cassandra
    container_name: rdg-cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - storage
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  flink-jobmanager:
    build: ./flink
    hostname: flink-jobmanager
    container_name: rdg-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      KAFKA_BOOTSTRAP: kafka:19092
      CASSANDRA_HOST: cassandra
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: filesystem
        state.checkpoints.dir: s3://flink-checkpoints/rdg/checkpoints
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 2147483647
        restart-strategy.fixed-delay.delay: 10s
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true
    volumes:
      - ./flink/jobs:/opt/flink/jobs
    networks:
      - stream
      - storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  flink-taskmanager:
    build: ./flink
    hostname: flink-taskmanager
    container_name: rdg-flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      KAFKA_BOOTSTRAP: kafka:19092
      CASSANDRA_HOST: cassandra
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: s3://flink-checkpoints/rdg/checkpoints
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 2147483647
        restart-strategy.fixed-delay.delay: 10s
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true
    volumes:
      - ./flink/jobs:/opt/flink/jobs
    networks:
      - stream
      - storage

  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: rdg-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - stream
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: rdg-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/flink-checkpoints &&
      echo MinIO bucket flink-checkpoints ready
      "
    networks:
      - stream
    restart: "no"

  init:
    build: ./init
    container_name: rdg-init
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./kafka/init-topics.sh:/kafka/init-topics.sh:ro
      - ./cassandra/schema.cql:/cassandra/schema.cql:ro
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      CASSANDRA_HOST: cassandra
    networks:
      - stream
      - storage
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: rdg-kafka-ui
    profiles: [dev]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    networks:
      - stream

  mock-producer:
    build: ./producers/mock
    container_name: rdg-mock-producer
    profiles: [dev]
    depends_on:
      kafka:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: metrics.raw
      PUBLISH_INTERVAL_SEC: "2"
    networks:
      - stream

networks:
  stream:
    name: rdg-stream
  storage:
    name: rdg-storage

volumes:
  kafka-data:
  cassandra-data:
  minio-data:
