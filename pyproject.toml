[project]
name = "rdg-stream"
version = "0.1.0"
description = "RDG Stream Platform — Kafka, PyFlink, Cassandra"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["flink", "producers"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
